name: Bug report
description: Report a reproducible Steam Friends problem without sharing private data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Steam Friends. Never include an API key, an unredacted snapshot, or private Steam data.

  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: 1.0.1
    validations:
      required: true

  - type: input
    id: omarchy-version
    attributes:
      label: Omarchy version
      description: Output of `omarchy version`.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Setup
        - Presence refresh
        - Cache or offline state
        - Theme or layout
        - Keyboard or mouse interaction
        - Steam action
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: Tell us the smallest reliable sequence that triggers the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Optional. Remove API keys, Steam IDs, friend names, profile URLs, and snapshot contents before posting.
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I verified that this report contains no API key or private Steam data.
          required: true

