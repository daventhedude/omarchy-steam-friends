name: Release assets

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out release tag without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install portable test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes jq ripgrep

      - name: Verify tag, syntax, and portable contracts
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(jq -er '.version | select(test("^[0-9]+[.][0-9]+[.][0-9]+$"))' manifest.json)"
          test "$RELEASE_TAG" = "v$version"
          git merge-base --is-ancestor "$RELEASE_TAG^{commit}" origin/main
          bash -n scripts/steam-friends tests/security.sh
          ./tests/security.sh
          ./tests/model-contract.mjs
          ./tests/ui-contract.mjs
          ./scripts/steam-friends demo | jq -e '.ok and .configured and (.friends | length == 5)' >/dev/null

  publish:
    name: Publish release assets
    needs:
      - verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out verified release tag without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Build reproducible archive and checksum
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="omarchy-steam-friends-${version}.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="omarchy-steam-friends-${version}/" \
            --output="$archive" \
            "$RELEASE_TAG"
          sha256sum "$archive" >"${archive}.sha256"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="omarchy-steam-friends-${version}.tar.gz"
          gh release upload "$RELEASE_TAG" "$archive" "${archive}.sha256" --clobber
