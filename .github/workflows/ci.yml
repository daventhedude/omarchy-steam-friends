name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-contracts:
    name: Portable contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install portable test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes jq ripgrep

      - name: Validate syntax and manifest
        run: |
          bash -n scripts/steam-friends tests/security.sh
          node --check tests/model-contract.mjs
          node --check tests/theme-contract.mjs
          node --check tests/ui-contract.mjs
          jq -e . manifest.json >/dev/null
          git diff-tree --check --no-commit-id --root -r HEAD

      - name: Run security contract
        run: ./tests/security.sh

      - name: Run QML model contract
        run: ./tests/model-contract.mjs

      - name: Run UI wiring contract
        run: ./tests/ui-contract.mjs

      - name: Validate deterministic demo data
        run: ./scripts/steam-friends demo | jq -e '.ok and .configured and (.friends | length == 5)' >/dev/null
